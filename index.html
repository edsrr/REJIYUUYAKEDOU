  /* --- 画面表示用スタイル --- */
  body {

    margin: 0;
    padding: 5px;
    background-color: #f7ede2; 
    color: #4a3728; 
    font-size: 14px;
  }
  h1 {
    font-size: 18px;
    margin: 4px 0;
    text-align: center;
    color: #8c2f1b; 
    border-bottom: 2px dashed #8c2f1b;
    padding-bottom: 3px;
  }
  .container {
    display: flex;
    max-width: 840px;
    margin: 0 auto;
    gap: 8px;
  }
  .left-panel { flex: 1.3; }
  .right-panel {
    flex: 1;
    background-color: #fffaf0;
    border: 2px dashed #8c2f1b;
    padding: 8px;
    border-radius: 4px;
  }
  .items-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    margin-bottom: 8px;
  }
  .btn-item {
    background-color: #fbd6a6; 
    border: 1px solid #d4a373;
    border-radius: 4px;
    padding: 10px 2px;
    font-size: 12px;
    font-weight: bold;
    color: #5c3d2e;
    cursor: pointer;
    text-align: center;
  }
  .btn-item:active { background-color: #e29578; }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  .btn-key {
    background-color: #f4f1de;
    border: 1px solid #cbd5e1;
    color: #5c3d2e;
    padding: 12px;

    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
  }
  .btn-key:active { background-color: #e0dcc5; }
  .btn-action {
    background-color: #f28482;
    border-color: #f28482;
    color: #fff;
  }
  .btn-action:active { background-color: #e56b6f; }

    background: #fffff6;
    border: 1px solid #d4a373;
    padding: 6px;
    min-height: 200px;
    max-height: 310px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 12px;
    white-space: pre-wrap;
    color: #333;
  }

  .scanner-panel {
    margin-top: 8px;
    background: #e0f2fe;
    padding: 6px;
    border-radius: 4px;
    border: 1px solid #7dd3fc;
    display: flex;
    gap: 5px;
  }
  
  .scanner-wrapper {
    position: relative;
    width: 100%;
    height: 180px;
    background: #000;
    margin-top: 5px;
    display: none;
    border-radius: 4px;
    overflow: hidden;
  }
  #webcam-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #interactive.viewport {
    width: 100%;
    height: 100%;
  }
  #interactive.viewport video, #interactive.viewport canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .master-panel {

    background: #fdf0d5;
    padding: 8px;
    border-radius: 4px;
    border: 1px solid #d4a373;
  }
  .master-title {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 5px;
    color: #6f1d1b;
  }
  .master-inputs input {
    font-size: 12px;
    padding: 4px;
    width: 28%;
    margin-right: 3px;
    border: 1px solid #d4a373;
    border-radius: 3px;
  }
  .btn-sub {
    font-size: 11px;
    padding: 6px 10px;
    background-color: #d4a373;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-weight: bold;
  }

    font-size: 11px;
    max-height: 80px;
    overflow-y: auto;

    padding: 4px;
    border: 1px solid #d4a373;
  }

    justify-content: space-between;
    margin-bottom: 2px;
    border-bottom: 1px dotted #ccc;
  }
